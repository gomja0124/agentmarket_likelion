name: Verify deployment branch

on:
  push:
    branches: [dokyeong-merge]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix backend ci
      - run: npm test
      - run: docker build -t agent-market-deployment .
